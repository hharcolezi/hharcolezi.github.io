name: Monthly website publication

on:
  schedule:
    # 1st day of every month, 13:17 UTC (09:17 EDT / 08:17 EST).
    - cron: '17 13 1 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all checks pass (disable for a dry run)'
        type: boolean
        default: true
  pull_request:
    branches: [master]

# A PR can only test. It never receives deployment permissions or publishes.
permissions:
  contents: read

concurrency:
  group: monthly-website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  # New commits should cancel stale PR validation, but production deployments
  # must never cancel one another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate complete static website
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out website sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned build/test dependencies
        run: python -m pip install -r _automation/requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s _automation -p 'test_*.py' -v

      - name: Read Sheets and render static content in the runner checkout
        run: python _automation/site.py prepare

      - name: Compile the existing Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
        env:
          JEKYLL_ENV: production

      - name: Restore runner ownership of build output
        # The official Jekyll container creates root-owned output.
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Check generated content, hyperlinks, navigation and assets
        run: python _automation/site.py verify

      - name: Install browser for finished-page tests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Playwright browser install attempt ${attempt}/2"
            if timeout -k 10s 300s python -m playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "${attempt}" -lt 2 ]; then
              echo "::warning::Browser installation timed out or failed; retrying once."
              sleep 10
            fi
          done
          echo "::error::Could not install the browser after two bounded attempts."
          exit 1

      - name: Test the finished pages with and without JavaScript
        run: python _automation/browser_check.py

      - name: Save validation report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-validation-${{ github.run_id }}
          path: _automation-output/
          if-no-files-found: ignore
          retention-days: 35

      - name: Upload validated website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site/
          retention-days: 7

  deploy:
    name: Publish validated website
    needs: build
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages uses this workflow, not competing branch builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mode=$(gh api "repos/${REPOSITORY}/pages" --jq '.build_type')
          if [ "$mode" != "workflow" ]; then
            echo '::error::One-time setup: Settings > Pages > Build and deployment > Source > GitHub Actions. Then run this workflow again. No website has been replaced.'
            exit 1
          fi

      - name: Deploy only the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
