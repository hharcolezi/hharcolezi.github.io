<link rel="stylesheet" href="/assets/css/sheet-cards.css">
<script src="/assets/js/google-sheet-utils.js"></script>

<div class="sheet-app">
  <div class="sheet-state" id="talks-state">Loading talks…</div>
  <div id="talks-list"></div>
</div>

<script>
(async () => {
  const S = window.HHASheets;
  const state = document.getElementById('talks-state');
  const root = document.getElementById('talks-list');
  const setState = (t) => { state.textContent = t; state.style.display = t ? 'block' : 'none'; };

  try {
    const rows = (await S.load('2108945094'))
      .filter((r) => r.title && S.selected(r))
      .sort((a,b) => Number(b.year||0)-Number(a.year||0));

    const groups = {};
    rows.forEach((r) => (groups[r.year || 'Other'] ||= []).push(r));

    const card = (r) => {
      const venue = r.venue_url ? S.link(r.venue, r.venue_url) : S.escapeHTML(r.venue || '');
      return `<article class="sheet-card">
        <div>${r.category ? `<span class="sheet-chip">${S.escapeHTML(r.category)}</span>` : ''}</div>
        <h3>${S.escapeHTML(r.title)}</h3>
        ${venue ? `<p>${venue}</p>` : ''}
        ${r.location ? `<p class="sheet-meta">${S.escapeHTML(r.location)}</p>` : ''}
        ${r.additional_details ? `<p class="sheet-meta">${S.escapeHTML(r.additional_details)}</p>` : ''}
      </article>`;
    };

    setState('');
    root.innerHTML = Object.keys(groups).sort((a,b)=>Number(b)-Number(a)).map((year) => `
      <section class="sheet-section"><h2>${S.escapeHTML(year)}</h2>
      <div class="sheet-grid">${groups[year].map(card).join('')}</div></section>`).join('');
  } catch (e) {
    setState('Unable to load talks from Google Sheets. ' + e.message);
  }
})();
</script>
